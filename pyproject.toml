[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "microstructure-signal"
version = "0.1.0"
description = "Audited BTCUSDT short-horizon microstructure signal study"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "matplotlib==3.10.6",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "pyarrow==24.0.0",
    "requests==2.32.5",
    "scikit-learn==1.7.2",
    "tqdm==4.67.3",
]

[project.optional-dependencies]
dev = [
    "polars==1.43.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore:y_pred contains classes not in y_true:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "data",
    "outputs",
    "local_notes",
    "notebooks",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]
